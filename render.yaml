# Render Blueprint: the backend. It owns the data (Postgres), Autopilot's schedule, failover and every SSH
# connection to the machines, so no InstaBox machine has to stay up for the dashboard to work.
# The Vercel site stays the front door: set BACKEND_URL there and it forwards /api and /go here.
#
# Create it: Render dashboard → New → Blueprint → pick this repo. Fill in the values it asks for
# (copy them from Vercel: SESSION_SECRET and CRON_SECRET MUST be the same on both).
# On its first start with the empty database it copies the dashboard's data from box5 by itself.

databases:
  - name: hosting-db
    databaseName: hosting
    user: hosting
    # free Postgres on Render expires after 30 days; basic-256mb keeps your data (about $6/month)
    plan: basic-256mb
    region: singapore
    ipAllowList: [] # only Render services can reach it

services:
  - type: web
    name: hosting-backend
    runtime: node
    region: singapore
    # free works: your machines ping it every few minutes, which keeps it awake. starter (about $7/month)
    # never sleeps, starts instantly and can send email alerts (free instances can't use SMTP ports).
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: hosting-db
          property: connectionString
      - key: INTERNAL_SCHEDULER
        value: "1"
      # the public address people use (the Vercel site): links, passkeys, GitHub webhooks and the machines' pings
      - key: APP_URL
        value: https://hosting-teal-nine.vercel.app
      # copy these from Vercel / .env.local (same values)
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: VMS
        sync: false
      - key: SSH_PRIVATE_KEY_B64
        sync: false
      - key: INSTABOX_HOST_KEY_SHA256
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
