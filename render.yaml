# Render Blueprint: the controller. It holds the keys, runs Autopilot's schedule and failover, and talks to every
# machine over SSH. It stores nothing itself: the dashboard's data stays on your own machines (STORE_VM first,
# with a copy on a second machine every 15 minutes; if the storage machine rests, the dashboard asks whether to
# wait or carry on from the copy).
# The Vercel site stays the front door: set BACKEND_URL there and it forwards /api and /go here.
#
# Create it: Render dashboard → New → Blueprint → pick this repo. Fill in the values it asks for
# (copy them from Vercel: SESSION_SECRET and CRON_SECRET MUST be the same on both).

services:
  - type: web
    name: hosting-backend
    runtime: node
    region: singapore
    # free: your machines ping it every few minutes, which keeps it awake. starter (about $7/month) never
    # sleeps, starts instantly and can send email alerts (free instances can't use SMTP ports).
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # the machine that keeps the dashboard's data at first (the dashboard can switch it later)
      - key: STORE_VM
        value: box5
      - key: INTERNAL_SCHEDULER
        value: "1"
      # the public address people use (the Vercel site): links, passkeys, GitHub webhooks and the machines' pings
      - key: APP_URL
        value: https://hosting-teal-nine.vercel.app
      # copy these from Vercel / .env.local (same values)
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: VMS
        sync: false
      - key: SSH_PRIVATE_KEY_B64
        sync: false
      - key: INSTABOX_HOST_KEY_SHA256
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
